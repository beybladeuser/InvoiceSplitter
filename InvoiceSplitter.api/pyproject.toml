[project]
name = "invoicesplitter-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "beybladeuser", email = "rubencruz0312@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
invoicesplitter-api = "invoicesplitter_api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
